name: Documentation

on:
  push:
    paths: ['doc/**', 'README.md', 'requirements.txt', 'lib/v2.0/python/**', 'lib/v2.0/C++/**', '.readthedocs.yaml', '.github/workflows/docs.yml']
  pull_request:
    paths: ['doc/**', 'README.md', 'requirements.txt', 'lib/v2.0/python/**', 'lib/v2.0/C++/**', '.readthedocs.yaml', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            doc/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r doc/requirements.txt
      - name: Build documentation and check references
        run: sphinx-build -W --keep-going -b html doc build/docs
